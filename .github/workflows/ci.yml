name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build --release
        run: cargo build --workspace --release

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo build --release
        run: cargo build --workspace --release

      - name: Start reference fixture
        run: |
          python3 test-fixture/test_fixture.py &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8000/safe -H "X-API-Key: x" && break
            sleep 0.5
          done

      - name: check flags the vulnerable endpoint
        run: |
          ./target/release/sidecheck check http://127.0.0.1:8000/vulnerable \
            --header X-API-Key --secret correct-secret-key-123456 \
            --samples 3000 --report /tmp/vulnerable.json
          python3 -c "
          import json
          r = json.load(open('/tmp/vulnerable.json'))
          assert r['significant'] is True, f'expected a detected leak, got: {r}'
          print('OK: vulnerable endpoint correctly flagged, leak =', r['estimated_leak_us'], 'us')
          "

      - name: check stays quiet on the safe endpoint
        run: |
          ./target/release/sidecheck check http://127.0.0.1:8000/safe \
            --header X-API-Key --secret correct-secret-key-123456 \
            --samples 3000 --confidence 0.999 --report /tmp/safe.json
          python3 -c "
          import json
          r = json.load(open('/tmp/safe.json'))
          assert r['significant'] is False, f'expected no leak, got a false positive: {r}'
          print('OK: safe endpoint correctly not flagged')
          "

      - name: sidecheck doctor runs cleanly
        run: ./target/release/sidecheck doctor http://127.0.0.1:8000/safe

      - name: Start json-login fixture (--json-body coverage)
        run: |
          python3 realistic-fixtures/json_login_fixture.py &
          for i in $(seq 1 20); do
            curl -s -o /dev/null -X POST http://127.0.0.1:8003/safe \
              -H "Content-Type: application/json" -d '{"username":"admin","password":"x"}' && break
            sleep 0.5
          done

      - name: without --json-body, the request never reaches the password comparison at all
        run: |
          # This is a protocol-level fact (wrong/missing username -> 401
          # before the password is even looked at), not something to
          # infer from sidecheck's own statistical test — asserting
          # significant == False on a live bootstrap CI would carry that
          # test's inherent ~5% false-positive rate at 95% confidence,
          # which makes CI flaky for no good reason. Verify directly.
          code_wrong=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8003/vulnerable \
            -H "Content-Type: application/json" -d '{"password":"0000000000000000000000000"}')
          code_right=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8003/vulnerable \
            -H "Content-Type: application/json" -d '{"password":"correct-secret-key-123456"}')
          echo "without username: wrong-password -> $code_wrong, correct-password -> $code_right"
          if [ "$code_wrong" != "401" ] || [ "$code_right" != "401" ]; then
            echo "expected 401 for both regardless of password when username is missing"
            exit 1
          fi
          echo "OK: confirmed the blind spot --json-body exists to close — both classes hit the same early exit without it"

      - name: --json-body reaches the comparison and flags the vulnerable endpoint
        run: |
          ./target/release/sidecheck check http://127.0.0.1:8003/vulnerable \
            --json-field password --json-body '{"username": "admin"}' \
            --secret correct-secret-key-123456 \
            --samples 3000 --report /tmp/json-body.json
          python3 -c "
          import json
          r = json.load(open('/tmp/json-body.json'))
          assert r['significant'] is True, f'expected a detected leak with --json-body, got: {r}'
          print('OK: json login endpoint correctly flagged with --json-body, leak =', r['estimated_leak_us'], 'us')
          "

      - name: --json-body stays quiet on the safe json-login endpoint
        run: |
          ./target/release/sidecheck check http://127.0.0.1:8003/safe \
            --json-field password --json-body '{"username": "admin"}' \
            --secret correct-secret-key-123456 \
            --samples 3000 --confidence 0.999 --report /tmp/json-safe.json
          python3 -c "
          import json
          r = json.load(open('/tmp/json-safe.json'))
          assert r['significant'] is False, f'expected no leak, got a false positive: {r}'
          print('OK: safe json-login endpoint correctly not flagged')
          "

      - name: --json-body rejects malformed input
        run: |
          set +e
          ./target/release/sidecheck check http://127.0.0.1:8003/vulnerable \
            --json-field password --json-body 'not json' --secret x 2>/tmp/badjson.err
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "expected a non-zero exit for invalid --json-body JSON"; exit 1; fi
          grep -q "not valid JSON" /tmp/badjson.err || { echo "unexpected error message:"; cat /tmp/badjson.err; exit 1; }
          echo "OK: invalid --json-body JSON rejected with a clear error"

      - name: --json-body without --json-field is rejected, not silently ignored
        run: |
          set +e
          ./target/release/sidecheck check http://127.0.0.1:8000/vulnerable \
            --header X-API-Key --json-body '{"a":1}' --secret x 2>/tmp/noflag.err
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then echo "expected a non-zero exit for --json-body without --json-field"; exit 1; fi
          grep -q "requires --json-field" /tmp/noflag.err || { echo "unexpected error message:"; cat /tmp/noflag.err; exit 1; }
          echo "OK: --json-body without --json-field rejected, regression for the 0.2.1 clap ArgGroup bug covered"

      - name: sidecheck compare flags a genuine regression
        run: |
          ./target/release/sidecheck check http://127.0.0.1:8000/safe \
            --header X-API-Key --secret correct-secret-key-123456 \
            --samples 2000 --confidence 0.999 --report /tmp/baseline.json
          ./target/release/sidecheck check http://127.0.0.1:8000/vulnerable \
            --header X-API-Key --secret correct-secret-key-123456 \
            --samples 2000 --report /tmp/current.json

          set +e
          ./target/release/sidecheck compare /tmp/baseline.json /tmp/current.json
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 for a clean-baseline vs leaking-current comparison, got $code"
            exit 1
          fi
          echo "OK: compare correctly flags a new leak as a regression (exit 1)"

      - name: sidecheck compare doesn't flag a pre-existing leak as new, and exits 0
        run: |
          set +e
          ./target/release/sidecheck compare /tmp/current.json /tmp/current.json
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "expected exit 0 when baseline and current both already show the same leak, got $code"
            exit 1
          fi
          echo "OK: compare doesn't fail CI on a leak that isn't new"

  action-selftest:
    name: self-test the composite GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start reference fixture
        run: |
          python3 test-fixture/test_fixture.py &
          for i in $(seq 1 20); do
            curl -s -o /dev/null http://127.0.0.1:8000/safe -H "X-API-Key: x" && break
            sleep 0.5
          done

      # Uses 'latest' rather than a pinned tag on purpose: this job tests
      # whether the action correctly orchestrates whatever sidecheck
      # binary is actually published right now, not a fixed historical
      # snapshot — a stale pin here would silently stop testing new CLI
      # features (like compare, below) the moment they ship without this
      # workflow file itself being touched. Real external usage should
      # still pin a specific release (see action/README.md) — that's a
      # different concern (reproducibility for consumers) from this job's
      # (does the action work against what's actually out there).
      - name: Run action against the vulnerable endpoint
        id: vulnerable
        uses: ./action
        with:
          target-url: http://127.0.0.1:8000/vulnerable
          header: X-API-Key
          secret: correct-secret-key-123456
          samples: '2000'
          version: 'latest'
          fail-on-leak: 'false'
          comment-on-pr: 'false'

      - name: Assert the vulnerable endpoint was flagged
        run: |
          if [ "${{ steps.vulnerable.outputs.significant }}" != "true" ]; then
            echo "expected significant=true for the vulnerable endpoint, got '${{ steps.vulnerable.outputs.significant }}'"
            exit 1
          fi
          if [ -z "${{ steps.vulnerable.outputs.estimated-leak-us }}" ]; then
            echo "expected a non-empty estimated-leak-us output"
            exit 1
          fi
          echo "OK: action correctly reports significant=true, leak=${{ steps.vulnerable.outputs.estimated-leak-us }}us"

      - name: Run action against the safe endpoint
        id: safe
        uses: ./action
        with:
          target-url: http://127.0.0.1:8000/safe
          header: X-API-Key
          secret: correct-secret-key-123456
          samples: '2000'
          confidence: '0.999'
          version: 'latest'
          fail-on-leak: 'true'
          comment-on-pr: 'false'

      - name: Assert the safe endpoint was not flagged
        run: |
          if [ "${{ steps.safe.outputs.significant }}" != "false" ]; then
            echo "expected significant=false for the safe endpoint, got '${{ steps.safe.outputs.significant }}'"
            exit 1
          fi
          echo "OK: action correctly reports significant=false, and fail-on-leak=true didn't fail this step since there was nothing to flag"

      - name: Compare via the action (regression case)
        id: compare-regression
        uses: ./action
        with:
          target-url: http://127.0.0.1:8000/vulnerable
          header: X-API-Key
          secret: correct-secret-key-123456
          samples: '2000'
          version: 'latest'
          baseline-report: ${{ steps.safe.outputs.report-path }}
          fail-on-regression: 'false'
          comment-on-pr: 'false'

      - name: Assert the action's compare step flagged a regression
        run: |
          if [ "${{ steps.compare-regression.outputs.regression }}" != "true" ]; then
            echo "expected regression=true (clean baseline, leaking current), got '${{ steps.compare-regression.outputs.regression }}'"
            exit 1
          fi
          echo "OK: action's baseline-report path correctly flags a regression"

      - name: Reject an invalid input combination
        id: invalid
        continue-on-error: true
        uses: ./action
        with:
          target-url: http://127.0.0.1:8000/vulnerable
          header: X-API-Key
          query: token
          secret: correct-secret-key-123456
          comment-on-pr: 'false'

      - name: Assert the invalid combination was rejected
        run: |
          if [ "${{ steps.invalid.outcome }}" != "failure" ]; then
            echo "expected the action to fail when both header and query are set"
            exit 1
          fi
          echo "OK: action rejects an ambiguous header+query combination"
