name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for a manual release, e.g. v0.2.1 (in case the tag push didn't trigger this workflow automatically)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # workflow_dispatch checks out the branch by default, not the tag —
  # this resolves the right ref for every job regardless of how the
  # workflow was triggered.
  RELEASE_REF: ${{ github.event.inputs.tag || github.ref }}

jobs:
  # Catches a mismatch between the tag and Cargo.toml BEFORE building (a
  # manual `git tag` that bypasses Prepare Release could drift from the
  # version in the manifest, and the binary would then print the wrong
  # --version).
  check-version:
    name: check tag matches Cargo.toml version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Compare tag to workspace version
        run: |
          tag="${RELEASE_REF#refs/tags/}"
          tag="${tag#v}"
          cargo_version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag: $tag, Cargo.toml: $cargo_version"
          if [ "$tag" != "$cargo_version" ]; then
            echo "::error::Tag v$tag does not match [workspace.package] version ($cargo_version) in Cargo.toml. Use Actions → Prepare Release instead of tagging manually."
            exit 1
          fi

  # sidecheck-core and sidecheck (CLI) share one workspace version, but
  # are published to crates.io as separate `cargo publish -p` steps — so
  # each step is idempotent: it checks the sparse index and skips a
  # version that's already published instead of failing. Order matters —
  # the CLI depends on core, so core is published first.
  publish-crates:
    name: publish to crates.io
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Publish sidecheck-core (if new version)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          name=sidecheck-core
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "local $name version: $version"

          len=${#name}
          if   [ "$len" -le 2 ]; then idx_path="$len/$name"
          elif [ "$len" -eq 3 ]; then idx_path="3/${name:0:1}/$name"
          else idx_path="${name:0:2}/${name:2:2}/$name"
          fi

          if curl -sf "https://index.crates.io/$idx_path" 2>/dev/null | grep -qF "\"vers\":\"$version\","; then
            echo "$name $version is already published, skipping"
          else
            cargo package -p "$name"
            cargo publish -p "$name"
            echo "waiting for crates.io index to pick up $name $version..."
            sleep 30
          fi

      - name: Publish sidecheck CLI (if new version)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          name=sidecheck
          version=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          echo "local $name version: $version"

          len=${#name}
          if   [ "$len" -le 2 ]; then idx_path="$len/$name"
          elif [ "$len" -eq 3 ]; then idx_path="3/${name:0:1}/$name"
          else idx_path="${name:0:2}/${name:2:2}/$name"
          fi

          if curl -sf "https://index.crates.io/$idx_path" 2>/dev/null | grep -qF "\"vers\":\"$version\","; then
            echo "$name $version is already published, skipping"
          else
            cargo package -p "$name"
            cargo publish -p "$name"
          fi

  build:
    name: build (${{ matrix.target }})
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: sidecheck-linux-x86_64
            bin: sidecheck
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: sidecheck-macos-x86_64
            bin: sidecheck
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: sidecheck-macos-aarch64
            bin: sidecheck
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: sidecheck-windows-x86_64.exe
            bin: sidecheck.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: cargo build --release -p sidecheck --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.artifact }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: create GitHub release
    needs: [build, publish-crates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find dist -type f -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Resolve tag name
        id: tag
        run: |
          # RELEASE_REF is either a full ref (push: refs/tags/v0.2.1) or
          # a short tag (workflow_dispatch: v0.2.1) — normalize to short.
          tag="${RELEASE_REF#refs/tags/}"
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: release-assets/*
          generate_release_notes: true
