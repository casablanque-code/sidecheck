name: Prepare Release

# The one step with a human in the loop: Actions → Prepare Release →
# Run workflow → enter the version. Everything after that is automatic:
#   1. version in the root Cargo.toml's [workspace.package] gets bumped —
#      the single place in the whole workspace; sidecheck-core and
#      sidecheck (CLI) read it via version.workspace = true, so both
#      crates always move version-for-version together.
#   2. commit "chore(release): vX.Y.Z"
#   3. tag vX.Y.Z, push the commit and the tag
#   4. the tag push triggers .github/workflows/release.yml — which
#      publishes both crates to crates.io (idempotently) and builds a
#      GitHub Release with binaries
#
# Never edit the .toml by hand for a sidecheck release again.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, semver without a leading 'v' (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN (default actions/checkout token) intentionally
          # cannot trigger other workflows when it pushes — this is how
          # the tag push below would fail to kick off release.yml.
          # RELEASE_PAT is a personal access token (repo scope is enough)
          # stored as a repo secret, used only so the tag push counts as
          # an external push and release.yml's `on: push: tags` fires.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Validate version format
        run: |
          v="${{ github.event.inputs.version }}"
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "Version must be X.Y.Z with no leading 'v' or suffix, got: '$v'";
            exit 1;
          }

      - name: Check tag doesn't already exist
        run: |
          if git rev-parse "v${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ github.event.inputs.version }} already exists";
            exit 1;
          fi

      - name: Bump workspace version
        run: |
          v="${{ github.event.inputs.version }}"
          sed -i 's/^version = ".*"$/version = "'"$v"'"/' Cargo.toml
          grep '^version = ' Cargo.toml

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml
          git commit -m "chore(release): v${{ github.event.inputs.version }}"
          git tag -a "v${{ github.event.inputs.version }}" -m "sidecheck v${{ github.event.inputs.version }}"
          git push origin HEAD:main
          git push origin "v${{ github.event.inputs.version }}"
